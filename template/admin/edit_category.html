{% extends 'admin/base.html' %}
{% block title %}Edit Category{% endblock %}

{% block content %}

<style>
    .form-card {
        background: #ffffff;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.06);
    }

    .btn-submit {
        border-radius: 30px;
        background: linear-gradient(90deg, #4e73df, #6f42c1);
        border: none;
        padding: 10px;
        font-weight: 600;
    }
</style>

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="form-card">

            <h4 class="mb-4">
                <i class="fa-solid fa-pen me-2"></i>
                Edit Category
            </h4>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label>Category Name</label>
                    <input type="text" name="cname" class="form-control"
                           value="{{ cat.cname }}" required>
                </div>

                <button type="submit" class="btn btn-submit text-white w-100">
                    Update Category
                </button>

            </form>

        </div>

    </div>
</div>

{% endblock %}
